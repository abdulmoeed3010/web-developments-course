<!DOCTYPE html>
<html>

<head>
    <title>My Space Fact File</title>
    <style>
        body {
            background-color: midnightblue;
            font-family: Arial, sans-serif;
        }

        .fact-file {
            background-color: lavender;
            color: darkslateblue;
            width: 260px;
            padding: 25px;
            border: 4px solid mediumpurple;
            margin: 30px;
        }
    /* Planet name - purple so it stands out */
.planet-name {
    color: purple;
    font-size: 22px;
}

/* Detail rows - dark text on the light background */
.detail {
    color: darkslateblue;
}

/* Cool fact - orange and italic to make it feel special */
.cool-fact {
    color: darkorange;
    font-style: italic;
}

</style>
</head>

<body>
    <div class="fact-file">
        <h2 class="planet-name">Mars</h2>
        <p class="detail">Distance from Sun: 227.9 million km</p>
        <p class="detail">Diameter: 6,779 km</p>
        <p class="detail">Moons: 2 (Phobos and Deimos)</p>
        <p class="cool-fact">Cool Fact: Mars has the largest volcano in the solar system, Olympus Mons!</p>
    </div>

    

    </body>
    </html>
