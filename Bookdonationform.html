<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Book Donation Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f1ea;
            color: #3a2e26;
            display: flex;
            justify-content: center;
            padding: 30px 10px;
        }

        .form-wrapper {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            padding: 30px 40px;
            max-width: 480px;
            width: 100%;
        }

        h1 {
            color: #6b4226;
            text-align: center;
            margin-bottom: 5px;
        }

        p {
            text-align: center;
            color: #7a6a5c;
            margin-top: 0;
        }

        hr {
            border: none;
            border-top: 2px solid #e8dfd3;
            margin: 20px 0;
        }

        fieldset {
            border: 2px solid #e8dfd3;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 18px;
        }

        legend {
            font-weight: bold;
            color: #b5651d;
            padding: 0 8px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #4a3b31;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            margin-top: 5px;
            border: 1px solid #d8cdbf;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background-color: #fbfaf7;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #b5651d;
            background-color: #fff;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #b5651d;
        }

        .radio-option,
        .checkbox-option {
            display: block;
            margin: 6px 0;
            font-weight: normal;
            color: #3a2e26;
        }

        textarea {
            resize: vertical;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #b5651d;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #8a4a13;
        }
    </style>
</head>

<body>
    <div class="form-wrapper">
        <h1>📚 Book Donation Form</h1>
        <p>Fill in the form below to donate books to the library!</p>
        <hr>
        <form>
            <fieldset>
                <legend>Donor Details</legend>
                <label>Your Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <br><br>
                <label>Donor ID</label>
                <input type="password" id="donor-id" placeholder="Enter your donor ID">
                <br><br>
                <label>Donation Date</label>
                <input type="date" id="donation-date">
            </fieldset>

            <fieldset>
                <legend>Book Details</legend>
                <label>Choose Book Category</label>
                <select id="category">
                    <option value="">-- Select a category --</option>
                    <option value="fiction">Fiction</option>
                    <option value="science">Science</option>
                    <option value="history">History</option>
                    <option value="education">Education</option>
                </select>
                <br><br>
                <label>Book Condition</label>
                <label class="radio-option"><input type="radio" name="condition" value="new"> Like New</label>
                <label class="radio-option"><input type="radio" name="condition" value="good"> Good</label>
                <label class="radio-option"><input type="radio" name="condition" value="used"> Used</label>
                <br>
                <label>Book Title or Additional Notes</label>
                <textarea id="notes" rows="3" placeholder="e.g. The book title, author name, or any notes."></textarea>
            </fieldset>

            <fieldset>
                <legend>Preferred Drop-Off Day</legend>
                <label class="checkbox-option"><input type="checkbox" value="mon"> Monday</label>
                <label class="checkbox-option"><input type="checkbox" value="wed"> Wednesday</label>
                <label class="checkbox-option"><input type="checkbox" value="fri"> Friday</label>
            </fieldset>

            <input type="submit" value="Donate My Book">
        </form>
    </div>
</body>

</html>
