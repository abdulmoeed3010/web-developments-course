<!DOCTYPE html>
<html>

<head>
    <title>My Space Explorer Card</title>

    <style>
        /* Typography - font, colour, and background */
        body {
            background-color: black;
            color: white;
            font-family: Verdana, sans-serif;
            text-align: center;
        }

        /* Typography + Text Shadow - large glowing title */
        .explorer-name {
            font-size: 55px;
            font-weight: bold;
            color: cyan;
            text-shadow: 3px 3px blue;
        }
    /* Typography + Text Transform */
.mission {
  font-style: italic;
  color: lightgray;
  text-transform: capitalize;
}

/* Text Transform + Text Decoration */
.heading {
  text-transform: uppercase;
  text-decoration: underline;
  color: gold;
}

/* Typography */
.skill {
  font-weight: bold;
  color: lightgreen;
}
/* Text Decoration */
.danger {
  text-decoration: line-through;
  color: tomato;
}

/* Transform */
.planet {
  font-size: 30px;
  font-weight: bold;
  color: orange;
  transform: rotate(-12deg);
  display: inline-block;
}

/* Typography */
.footer {
  color: lightblue;
  font-style: italic;
}
</style>
</head>
<body>


    71 <h1 class="explorer-name">Captain Nova</h1>
    72
    73 <p class="mission">leader of the galaxy exploration team</p>
    74
    75 <h2 class="heading">special skills</h2>
    76
    77 <p class="skill">Can pilot any spaceship</p>
    78 <p class="skill">Can survive on different planets</p>
    79
    80 <h2 class="heading">space dangers</h2>
    81
    82 <p class="danger">Asteroid Storms</p>
    83 <p class="danger">Black Holes</p>
    84
    85 <p class="planet">Planet X</p>
    86
    87 <p class="footer">Created by Abdul Moeed</p>
    88
    89 </body>
    </html>
