<html>
    <head>
        <title> My Zoo</title>
        <style>

            body {
                font-family: Arial,sans-serif;
                background: aliceblue;
                text-align:center;
                padding:30px;
            }

            h1 {
                color: #ff5a43;

            }

            #zoo {
                border:2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background:white;
            }

            .zone {
                border: 1px solid #ff5a43;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }

            button {
                 background:#ff5a43;
                 color: white;
                 padding: 10px 24px;
                 border: none;
                 border-radius: 20px;
                cursor: pointer;
    }

</style>
</head>

<body>

    <h1>My Zoo</h1>
    <p>Use JavaScript and the DOM to add animals to each cage!</p>

    
    <div id="zoo">
    <div class="zone">Zone 1 <span id="zone 1"></span></div>
    <div class="zone">Zone 2 <span id="zone 2"></span></div>
    <div class="zone">Zone 3 <span id="zone 3"></span></div>
    <div class="zone">Total Animals: <span id="total"></span> </div>
    </div>

    <br>
    <button onclick="openzoo()">Open the zoo</button>
    <p id="zoo-status"></p>
    <script>

        function openzoo() {
            /* task 1: add your first animal to zone 1 */
            document.getElementById("zone 1").innerHTML = "lion";

             /* task 1: add your first animal to zone 1 */
            document.getElementById("zone 2").innerHTML = "elephant";

             /* task 1: add your first animal to zone 1 */
            document.getElementById("zone 3").innerHTML = "penguin";

             /* task 1: add your first animal to zone 1 */
            document.getElementById("total").innerHTML = "3";

            /* task 5: change the zoo background */
            document.getElementById("zoo").style.backgroundColor = "lightgreen";

            /*task 6  use the document pafe to show the title */
            document.getElementById("zoo-status").innerHTML = document.title + "is now open";



        }
    </script>
     </body>      
        
    
</html>
